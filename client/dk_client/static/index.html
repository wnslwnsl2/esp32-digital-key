<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Key</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Digital Key</h1>
      <button id="btn-logout" class="btn btn-sm" onclick="logout()">Logout</button>
    </header>

    <!-- Account & Vehicle Info -->
    <div class="card" id="card-info">
      <div class="info-row">
        <span class="info-label">Account</span>
        <span class="info-value" id="info-account">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">Vehicle</span>
        <span class="info-value" id="info-vehicle">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">Role</span>
        <span class="info-value" id="info-role">-</span>
      </div>
      <div class="info-row" id="share-row" style="display: none;">
        <span class="info-label">Key Sharing</span>
        <button class="btn btn-sm btn-primary" onclick="showShareModal()">Share</button>
      </div>
      <div id="shared-keys-section" style="display: none;">
        <div class="info-row" style="border-top: none;">
          <span class="info-label">Shared Keys</span>
        </div>
        <div id="shared-keys-list"></div>
      </div>
    </div>

    <!-- Scanning -->
    <div class="card" id="card-scanning">
      <div class="scan-status">
        <div class="scan-spinner"></div>
        <h2 id="scan-text">Searching for your vehicle...</h2>
        <p class="scan-detail" id="scan-detail"></p>
      </div>
    </div>

    <!-- Connect Progress -->
    <div class="card" id="card-progress" style="display: none;">
      <div class="progress-steps">
        <div class="step" id="step-connect">
          <div class="step-indicator">
            <span class="step-icon">&#9679;</span>
            <span class="step-line"></span>
          </div>
          <div class="step-content">
            <div class="step-header">
              <span class="step-label">Connect</span>
              <span class="step-time"></span>
            </div>
            <div class="step-detail"></div>
          </div>
        </div>
        <div class="step" id="step-key_register">
          <div class="step-indicator">
            <span class="step-icon">&#9679;</span>
            <span class="step-line"></span>
          </div>
          <div class="step-content">
            <div class="step-header">
              <span class="step-label">Register Key</span>
              <span class="step-time"></span>
            </div>
            <div class="step-detail"></div>
          </div>
        </div>
        <div class="step" id="step-auth">
          <div class="step-indicator">
            <span class="step-icon">&#9679;</span>
            <span class="step-line"></span>
          </div>
          <div class="step-content">
            <div class="step-header">
              <span class="step-label">Authenticate</span>
              <span class="step-time"></span>
            </div>
            <div class="step-detail"></div>
          </div>
        </div>
        <div class="step" id="step-device_auth">
          <div class="step-indicator">
            <span class="step-icon">&#9679;</span>
            <span class="step-line"></span>
          </div>
          <div class="step-content">
            <div class="step-header">
              <span class="step-label">Device Auth</span>
              <span class="step-time"></span>
            </div>
            <div class="step-detail"></div>
          </div>
        </div>
        <div class="step" id="step-subscribe">
          <div class="step-indicator">
            <span class="step-icon">&#9679;</span>
          </div>
          <div class="step-content">
            <div class="step-header">
              <span class="step-label">Subscribe</span>
              <span class="step-time"></span>
            </div>
            <div class="step-detail"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Lock Status -->
    <div class="card" id="card-lock" style="display: none;">
      <div class="lock-status-display">
        <div id="lock-indicator" class="lock-indicator locked"></div>
        <span id="lock-state-text">LOCKED</span>
      </div>
    </div>

    <!-- System Status -->
    <div class="card" id="card-status" style="display: none;">
      <h2>Status</h2>
      <div class="info-grid">
        <div class="info-item">
          <label>Auth</label>
          <span id="status-auth">-</span>
        </div>
        <div class="info-item">
          <label>Zone</label>
          <span id="status-zone">-</span>
        </div>
        <div class="info-item">
          <label>RSSI</label>
          <span id="status-rssi">-</span>
        </div>
        <div class="info-item">
          <label>Lock</label>
          <span id="status-lock">-</span>
        </div>
        <div class="info-item">
          <label>Registered Keys</label>
          <span id="status-reg-keys">-</span>
        </div>
      </div>
    </div>

    <!-- Log -->
    <div class="card">
      <h2>Log</h2>
      <div id="log-container"></div>
    </div>
  </div>

  <!-- Share Modal -->
  <div class="modal-overlay" id="share-modal">
    <div class="modal">
      <h3>Share Vehicle</h3>
      <div class="form-group">
        <label>Account</label>
        <select id="share-account"></select>
      </div>
      <div class="form-group">
        <label>Role</label>
        <select id="share-role" onchange="toggleShareExpiry()">
          <option value="family" selected>Family</option>
          <option value="guest">Guest</option>
        </select>
      </div>
      <div class="form-group" id="share-expiry-group" style="display:none">
        <label>Expires at</label>
        <input type="datetime-local" id="share-expires">
      </div>
      <div class="modal-actions">
        <button class="btn btn-sm" onclick="hideShareModal()">Cancel</button>
        <button class="btn btn-sm btn-primary" onclick="submitShare()">Share</button>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
